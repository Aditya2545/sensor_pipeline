sensor_publisher:
  ros__parameters:
    publish_rate: 2.0
    sensor_id: "sensor_001"
    add_noise: true

sensor_filter:
  ros__parameters:
    window_size: 5
    temp_min: -10.0
    temp_max: 60.0
    humidity_min: 0.0
    humidity_max: 100.0

data_logger:
  ros__parameters:
    log_dir: "/home/aditya/sensor_logs"
    log_interval: 1.0
